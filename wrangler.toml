name = "markaz-baladi-karada"
compatibility_date = "2024-01-01"

# ──────────────────────────────────────────
#  Cloudflare Pages configuration
# ──────────────────────────────────────────
pages_build_output_dir = "."

# ──────────────────────────────────────────
#  D1 Database  (violations metadata)
# ──────────────────────────────────────────
[[d1_databases]]
binding     = "DB"
database_name = "karada-violations"
database_id   = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

# ──────────────────────────────────────────
#  R2 Bucket  (file / image storage)
# ──────────────────────────────────────────
[[r2_buckets]]
binding     = "FILES"
bucket_name = "karada-files"
